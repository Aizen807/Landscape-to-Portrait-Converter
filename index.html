<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landscape → Portrait Converter</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0d1117;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #161b22;
            border-radius: 28px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid #30363d;
        }
        h1 {
            color: #f0f6fc;
            font-weight: 500;
            font-size: 26px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h1 small {
            font-size: 15px;
            font-weight: 400;
            color: #8b949e;
        }
        .sub {
            color: #8b949e;
            margin-bottom: 24px;
            font-size: 14px;
            padding-left: 14px;
            border-left: 3px solid #58a6ff;
            background: #0d1117;
            padding: 8px 14px;
            border-radius: 0 10px 10px 0;
        }
        .drop-zone {
            background: #0d1117;
            border: 2px dashed #30363d;
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 20px;
        }
        .drop-zone:hover {
            border-color: #58a6ff;
            background: #161b22;
        }
        .drop-zone.dragover {
            border-color: #58a6ff;
            background: #1c2333;
            box-shadow: 0 0 0 4px rgba(88, 166, 255, 0.15);
        }
        .drop-zone .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        .drop-zone p {
            color: #c9d1d9;
            font-size: 15px;
        }
        .drop-zone .file-label {
            display: inline-block;
            background: #21262d;
            color: #f0f6fc;
            padding: 8px 20px;
            border-radius: 30px;
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid #30363d;
            transition: 0.15s;
        }
        .drop-zone .file-label:hover {
            background: #30363d;
            border-color: #58a6ff;
        }
        input[type="file"] {
            display: none;
        }
        .preview-box {
            display: none;
            margin: 20px 0 16px;
        }
        .preview-box.active {
            display: block;
        }
        .video-wrap {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }
        .video-wrap video {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 9 / 16;
            object-fit: cover;
            background: #000;
        }
        .file-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 14px;
            padding: 0 4px;
        }
        .file-info .name {
            color: #f0f6fc;
            font-size: 14px;
            background: #0d1117;
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid #21262d;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-info .status {
            color: #8b949e;
            font-size: 13px;
            background: #0d1117;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid #21262d;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .actions button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-reset {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
        }
        .btn-reset:hover {
            background: #30363d;
        }
        .btn-reset:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-download {
            background: #238636;
            color: #fff;
            border: 1px solid #2ea043;
        }
        .btn-download:hover {
            background: #2ea043;
        }
        .btn-download:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-download.processing {
            background: #1a5a2a;
            pointer-events: none;
        }
        .footer {
            color: #484f58;
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid #21262d;
            padding-top: 18px;
        }
        .footer strong {
            color: #8b949e;
            font-weight: 500;
        }
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #21262d;
            border-radius: 4px;
            margin: 12px 0 4px;
            overflow: hidden;
            display: none;
        }
        .progress-bar.active {
            display: block;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: #58a6ff;
            border-radius: 4px;
            transition: width 0.2s;
        }
        .progress-text {
            color: #8b949e;
            font-size: 13px;
            text-align: center;
            margin-top: 4px;
            display: none;
        }
        .progress-text.active {
            display: block;
        }
        @media (max-width: 500px) {
            .container {
                padding: 16px;
            }
            .actions button {
                min-width: 100px;
                padding: 10px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>
            ⟳ Crop to Portrait
            <small>landscape → 9:16</small>
        </h1>
        <div class="sub">⚡ Removes black bars · crops center · exports as WebM</div>

        <!-- Drop Zone -->
        <div class="drop-zone" id="dropZone">
            <span class="icon">🎬</span>
            <p>Drop your landscape video here</p>
            <label class="file-label" for="fileInput">📁 Choose file</label>
            <input type="file" id="fileInput" accept="video/*" />
            <div style="color:#484f58; font-size:12px; margin-top:8px;">MP4, WebM, MOV · up to 200MB</div>
        </div>

        <!-- Preview -->
        <div class="preview-box" id="previewBox">
            <div class="file-info">
                <span class="name" id="fileName">video.mp4</span>
                <span class="status" id="statusBadge">⚡ portrait crop</span>
            </div>
            <div class="video-wrap">
                <video id="videoPlayer" controls playsinline></video>
            </div>
            <div class="progress-bar" id="progressBar">
                <div class="fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Encoding ... 0%</div>
            <div class="actions">
                <button class="btn-reset" id="resetBtn" disabled>↺ Reset</button>
                <button class="btn-download" id="downloadBtn" disabled>⬇ Download Portrait</button>
            </div>
        </div>

        <div class="footer">
            <strong>How it works:</strong> crops the center 9:16 area · uses Canvas + MediaRecorder
        </div>
    </div>

    <script>
        (function() {
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const video = document.getElementById('videoPlayer');
            const previewBox = document.getElementById('previewBox');
            const fileName = document.getElementById('fileName');
            const statusBadge = document.getElementById('statusBadge');
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');

            let currentFile = null;
            let objectURL = null;
            let isProcessing = false;

            // ---- helpers ----
            function resetAll() {
                if (objectURL) {
                    URL.revokeObjectURL(objectURL);
                    objectURL = null;
                }
                video.src = '';
                video.load();
                previewBox.classList.remove('active');
                currentFile = null;
                downloadBtn.disabled = true;
                resetBtn.disabled = true;
                fileName.textContent = 'no file';
                statusBadge.textContent = '⚡ portrait crop';
                progressBar.classList.remove('active');
                progressText.classList.remove('active');
                progressFill.style.width = '0%';
                isProcessing = false;
                downloadBtn.classList.remove('processing');
                downloadBtn.textContent = '⬇ Download Portrait';
                // reset dropzone text
                const p = dropZone.querySelector('p');
                if (p) {
                    p.innerHTML = `Drop your landscape video here`;
                }
                const label = dropZone.querySelector('.file-label');
                if (label) label.textContent = '📁 Choose file';
                // remove any old onended
                video.onended = null;
            }

            function loadFile(file) {
                if (!file) return;
                if (!file.type.startsWith('video/')) {
                    alert('Please select a video file.');
                    return;
                }
                // reset previous
                if (objectURL) {
                    URL.revokeObjectURL(objectURL);
                    objectURL = null;
                }
                currentFile = file;
                objectURL = URL.createObjectURL(file);
                video.src = objectURL;
                video.load();

                previewBox.classList.add('active');
                downloadBtn.disabled = false;
                resetBtn.disabled = false;
                fileName.textContent = file.name.length > 30 ? file.name.slice(0, 27) + '…' : file.name;
                statusBadge.textContent = '📐 cropping to 9:16';
                progressBar.classList.remove('active');
                progressText.classList.remove('active');
                progressFill.style.width = '0%';
                isProcessing = false;
                downloadBtn.classList.remove('processing');
                downloadBtn.textContent = '⬇ Download Portrait';

                // update dropzone text
                const p = dropZone.querySelector('p');
                if (p) {
                    p.innerHTML = `📁 <span style="color:#58a6ff;">${file.name}</span> · ready`;
                }
                const label = dropZone.querySelector('.file-label');
                if (label) label.textContent = '🔄 Replace';

                video.onloadedmetadata = function() {
                    const w = video.videoWidth;
                    const h = video.videoHeight;
                    if (w && h) {
                        if (w / h > 1.1) {
                            statusBadge.textContent = '✅ Landscape · crop to 9:16';
                        } else {
                            statusBadge.textContent = '📐 Portrait or square · crop to 9:16';
                        }
                    }
                };
            }

            // ---- download / export ----
            function exportPortrait() {
                if (!currentFile || !video.src) {
                    alert('No video loaded.');
                    return;
                }
                if (isProcessing) return;
                if (video.readyState < 2) {
                    alert('Video not ready. Please wait for it to load.');
                    return;
                }

                const vw = video.videoWidth;
                const vh = video.videoHeight;
                if (!vw || !vh) {
                    alert('Cannot read video dimensions.');
                    return;
                }

                // target 9:16 portrait
                const targetRatio = 9 / 16;
                let cropX, cropY, cropW, cropH;

                // crop center to 9:16
                const currentRatio = vw / vh;
                if (currentRatio >= targetRatio) {
                    // wider: crop width
                    cropH = vh;
                    cropW = vh * targetRatio;
                    cropX = (vw - cropW) / 2;
                    cropY = 0;
                } else {
                    // taller: crop height
                    cropW = vw;
                    cropH = vw / targetRatio;
                    cropX = 0;
                    cropY = (vh - cropH) / 2;
                }

                cropX = Math.round(cropX);
                cropY = Math.round(cropY);
                cropW = Math.round(cropW);
                cropH = Math.round(cropH);

                // canvas
                const canvas = document.createElement('canvas');
                canvas.width = cropW;
                canvas.height = cropH;
                const ctx = canvas.getContext('2d');

                // We'll use captureStream + MediaRecorder
                const stream = canvas.captureStream(30);
                const mimeTypes = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
                let mimeType = mimeTypes.find(t => MediaRecorder.isTypeSupported(t));
                if (!mimeType) {
                    alert('Your browser does not support WebM encoding. Please use Chrome/Edge/Firefox.');
                    return;
                }

                const recorder = new MediaRecorder(stream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 5000000
                });

                let chunks = [];
                recorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const baseName = currentFile.name.replace(/\.[^.]+$/, '') || 'video';
                    a.download = baseName + '_portrait.webm';
                    a.href = url;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                    chunks = [];

                    // reset UI
                    isProcessing = false;
                    downloadBtn.classList.remove('processing');
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = '⬇ Download Portrait';
                    progressBar.classList.remove('active');
                    progressText.classList.remove('active');
                    video.onended = null;
                    // resume controls
                    video.controls = true;
                };

                recorder.onerror = (e) => {
                    console.error('Recorder error:', e);
                    alert('Encoding error. Please try again.');
                    isProcessing = false;
                    downloadBtn.classList.remove('processing');
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = '⬇ Download Portrait';
                    progressBar.classList.remove('active');
                    progressText.classList.remove('active');
                    video.controls = true;
                };

                // ---- start recording ----
                isProcessing = true;
                downloadBtn.classList.add('processing');
                downloadBtn.disabled = true;
                downloadBtn.textContent = '⏳ Encoding...';
                progressBar.classList.add('active');
                progressText.classList.add('active');
                progressFill.style.width = '0%';
                progressText.textContent = 'Encoding ... 0%';

                // disable video controls during encoding to avoid seeking issues
                video.controls = false;

                // seek to start, play
                video.currentTime = 0;
                video.play();

                // start recorder after a small delay
                setTimeout(() => {
                    recorder.start(1000 / 30);
                }, 200);

                // ---- draw frames ----
                let frameCount = 0;
                let totalFrames = 0;
                // we'll estimate total frames from duration * 30
                const estimateFrames = () => {
                    if (video.duration && isFinite(video.duration)) {
                        totalFrames = Math.round(video.duration * 30);
                    } else {
                        totalFrames = 300; // fallback
                    }
                };
                estimateFrames();

                // update progress when metadata loaded
                video.onloadedmetadata = estimateFrames;

                let animationId = null;

                function drawFrame() {
                    if (!isProcessing) {
                        // if stopped externally
                        return;
                    }

                    // draw cropped region
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                    // progress
                    frameCount++;
                    if (totalFrames > 0 && frameCount % 5 === 0) {
                        let pct = Math.min(100, Math.round((frameCount / totalFrames) * 100));
                        progressFill.style.width = pct + '%';
                        progressText.textContent = `Encoding ... ${pct}%`;
                    }

                    // if video ended, stop recorder
                    if (video.ended) {
                        if (recorder.state === 'recording') {
                            recorder.stop();
                        }
                        isProcessing = false;
                        progressFill.style.width = '100%';
                        progressText.textContent = 'Done!';
                        return;
                    }

                    // if paused (user might have paused) we keep drawing last frame but we should continue
                    if (!video.paused) {
                        animationId = requestAnimationFrame(drawFrame);
                    } else {
                        // if paused, we wait until it plays again
                        const checkPlay = () => {
                            if (!video.paused) {
                                animationId = requestAnimationFrame(drawFrame);
                            } else {
                                requestAnimationFrame(checkPlay);
                            }
                        };
                        requestAnimationFrame(checkPlay);
                    }
                }

                // handle pause/resume
                video.onpause = () => {
                    // just let drawFrame handle it via checkPlay
                };
                video.onplay = () => {
                    // if we don't have an animation running, start it
                    if (!animationId && isProcessing) {
                        animationId = requestAnimationFrame(drawFrame);
                    }
                };

                // start drawing
                animationId = requestAnimationFrame(drawFrame);

                // also handle video end
                video.onended = () => {
                    if (recorder.state === 'recording') {
                        recorder.stop();
                    }
                    isProcessing = false;
                    progressFill.style.width = '100%';
                    progressText.textContent = 'Done!';
                    downloadBtn.disabled = false;
                    downloadBtn.classList.remove('processing');
                    downloadBtn.textContent = '⬇ Download Portrait';
                    video.controls = true;
                };

                // safety: if video stalls or takes too long, we stop after 10min?
                // but we rely on ended event.
                // also if user clicks reset, we need to abort.
                // we store a reference to abort.
                window.__abortExport = () => {
                    if (recorder.state === 'recording') {
                        recorder.stop();
                    }
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                    isProcessing = false;
                    downloadBtn.classList.remove('processing');
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = '⬇ Download Portrait';
                    progressBar.classList.remove('active');
                    progressText.classList.remove('active');
                    video.controls = true;
                    video.onended = null;
                };
            }

            // ---- event listeners ----
            fileInput.addEventListener('change', function(e) {
                if (this.files && this.files.length > 0) {
                    // if processing, abort
                    if (isProcessing) {
                        if (window.__abortExport) window.__abortExport();
                    }
                    loadFile(this.files[0]);
                }
                this.value = '';
            });

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    if (isProcessing) {
                        if (window.__abortExport) window.__abortExport();
                    }
                    loadFile(files[0]);
                }
            });
            dropZone.addEventListener('click', (e) => {
                if (e.target.tagName !== 'LABEL' && !e.target.closest('label')) {
                    fileInput.click();
                }
            });

            downloadBtn.addEventListener('click', exportPortrait);

            resetBtn.addEventListener('click', () => {
                if (isProcessing) {
                    if (window.__abortExport) window.__abortExport();
                }
                resetAll();
                fileInput.value = '';
                const p = dropZone.querySelector('p');
                if (p) p.innerHTML = `Drop your landscape video here`;
                const label = dropZone.querySelector('.file-label');
                if (label) label.textContent = '📁 Choose file';
            });

            // initial reset
            resetAll();

            // clean up on page unload
            window.addEventListener('beforeunload', () => {
                if (objectURL) URL.revokeObjectURL(objectURL);
                if (window.__abortExport) window.__abortExport();
            });
        })();
    </script>
</body>
</html>
