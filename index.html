<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Video Cropper · Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: linear-gradient(145deg, #0b0e18 0%, #1a1f2e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }
    .card {
      max-width: 780px;
      width: 100%;
      background: rgba(22, 28, 46, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 25px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.2s;
    }
    h1 {
      color: #f0f3fa;
      font-weight: 500;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }
    h1 small {
      font-size: 0.9rem;
      font-weight: 400;
      color: #8892b0;
      margin-left: 0.4rem;
    }
    .sub {
      color: #a8b2d1;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      border-left: 3px solid #4f7df3;
      padding-left: 1rem;
      background: rgba(79, 125, 243, 0.06);
      border-radius: 0 12px 12px 0;
      line-height: 1.5;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: rgba(0, 0, 0, 0.2);
      padding: 1rem;
      border-radius: 1.2rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .setting-item {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .setting-item label {
      color: #8892b0;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, input {
      background: #1a233b;
      border: 1px solid #31416a;
      color: #f0f3fa;
      padding: 0.6rem;
      border-radius: 0.8rem;
      font-size: 0.9rem;
      outline: none;
    }
    select:focus, input:focus {
      border-color: #4f7df3;
    }
    .dropzone {
      background: rgba(12, 17, 29, 0.6);
      border: 2px dashed #3d4a6b;
      border-radius: 2rem;
      padding: 2.8rem 1.5rem;
      text-align: center;
      transition: 0.2s;
      cursor: pointer;
      margin-bottom: 1.8rem;
      position: relative;
    }
    .dropzone:hover {
      border-color: #6b8aff;
      background: rgba(30, 40, 70, 0.5);
    }
    .dropzone.drag-over {
      border-color: #8aabff;
      background: rgba(60, 90, 180, 0.15);
      box-shadow: 0 0 0 4px rgba(79, 125, 243, 0.2);
    }
    .dropzone p {
      color: #b6c2e0;
      font-size: 1.1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }
    .dropzone span {
      font-size: 2.6rem;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    }
    .file-label {
      background: #2d3a5e;
      padding: 0.5rem 1.4rem;
      border-radius: 60px;
      color: white;
      font-weight: 500;
      font-size: 0.9rem;
      display: inline-block;
      margin-top: 0.8rem;
      transition: 0.15s;
      border: 1px solid #4c5d84;
    }
    input[type="file"] {
      display: none;
    }
    .preview-container {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      margin: 1.8rem 0 1.2rem;
    }
    .video-wrapper {
      background: #0b0f19;
      border-radius: 1.8rem;
      overflow: hidden;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.6);
      position: relative;
      max-height: 400px;
      display: flex;
      justify-content: center;
    }
    video {
      display: block;
      height: 100%;
      width: auto;
      background: #070a12;
      object-fit: cover;
    }
    .badge {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0.2rem 0 0.8rem;
    }
    .badge span {
      background: #1f2842;
      padding: 0.25rem 1rem;
      border-radius: 40px;
      color: #b7c6f0;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      border: 1px solid #33405f;
    }
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      justify-content: center;
      margin: 1.5rem 0 0.2rem;
    }
    .btn {
      background: #2c3a60;
      border: none;
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      font-weight: 500;
      color: #e8edff;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.15s;
      border: 1px solid #405079;
      cursor: pointer;
      flex: 1 1 auto;
      justify-content: center;
    }
    .btn-primary {
      background: #4f7df3;
      border-color: #6b8eff;
      color: white;
      box-shadow: 0 8px 18px -6px #1f3a8a;
    }
    .btn-primary:hover {
      background: #5f8aff;
      transform: scale(1.01);
    }
    .btn-primary:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .info-text {
      color: #7b89b0;
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1.2rem;
      border-top: 1px solid #25304b;
      padding-top: 1.2rem;
    }
    .filename {
      color: #c8d4f5;
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .custom-res-inputs {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .custom-res-inputs input {
      width: 70px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>
      ⟳ Smart Cropper
      <small>landscape → mobile fit</small>
    </h1>
    <div class="sub">
      ⚡ Auto-fits your specific phone screen resolution
    </div>

    <!-- Settings -->
    <div class="settings-grid">
      <div class="setting-item">
        <label>Target Device</label>
        <select id="deviceSelect">
          <option value="1080x2340">Huawei Y9 Prime (1080x2340)</option>
          <option value="1080x1920">Standard Portrait (9:16)</option>
          <option value="1170x2532">iPhone 13/14 (19.5:9)</option>
          <option value="1290x2796">iPhone 14/15 Pro Max</option>
          <option value="custom">Custom Resolution...</option>
        </select>
      </div>
      <div class="setting-item" id="customResGroup" style="display: none;">
        <label>Custom W x H</label>
        <div class="custom-res-inputs">
          <input type="number" id="customWidth" value="1080" placeholder="W">
          <span style="color: #4f7df3;">×</span>
          <input type="number" id="customHeight" value="2340" placeholder="H">
        </div>
      </div>
      <div class="setting-item" id="autoDetectGroup">
        <label>Auto-Detect</label>
        <button class="btn" id="detectBtn" style="padding: 0.4rem; font-size: 0.8rem; border-radius: 0.5rem;">Use My Screen</button>
      </div>
    </div>

    <!-- dropzone -->
    <div class="dropzone" id="dropzone">
      <p>
        <span>🎬</span>
        Drop landscape video here
        <label class="file-label" for="fileInput">choose file</label>
      </p>
      <input type="file" id="fileInput" accept="video/*">
    </div>

    <!-- preview -->
    <div class="preview-container" id="previewContainer" style="display: none;">
      <div class="badge">
        <span class="filename" id="fileName">video.mp4</span>
        <span id="statusBadge">⏺ processing</span>
      </div>
      <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" controls playsinline></video>
      </div>
      <div style="text-align: center; font-size: 0.8rem; color: #8895c0; margin-top: 0.5rem;">
        <span id="aspectHint" style="background: #1b233b; padding: 0.2rem 1rem; border-radius: 30px;">Aspect: 9:19.5</span>
      </div>
    </div>

    <!-- action buttons -->
    <div class="action-bar">
      <button class="btn" id="resetBtn" disabled>↺ reset</button>
      <button class="btn btn-primary" id="convertBtn" disabled>⬇ Download for Phone</button>
    </div>
    
    <div class="info-text">
      <strong>Pro Tip:</strong> We crop the center area to match your phone's exact pixels.<br>
      Keep this tab active while the video plays to encode.
    </div>
  </div>

  <script>
    (function() {
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('fileInput');
      const videoPlayer = document.getElementById('videoPlayer');
      const previewContainer = document.getElementById('previewContainer');
      const fileNameSpan = document.getElementById('fileName');
      const statusBadge = document.getElementById('statusBadge');
      const convertBtn = document.getElementById('convertBtn');
      const resetBtn = document.getElementById('resetBtn');
      const deviceSelect = document.getElementById('deviceSelect');
      const customResGroup = document.getElementById('customResGroup');
      const customWidth = document.getElementById('customWidth');
      const customHeight = document.getElementById('customHeight');
      const detectBtn = document.getElementById('detectBtn');
      const aspectHint = document.getElementById('aspectHint');
      const videoWrapper = document.getElementById('videoWrapper');

      let currentFile = null;
      let objectURL = null;

      // Handle Device Selection
      deviceSelect.addEventListener('change', () => {
        if (deviceSelect.value === 'custom') {
          customResGroup.style.display = 'flex';
        } else {
          customResGroup.style.display = 'none';
          updatePreviewAspect();
        }
      });

      [customWidth, customHeight].forEach(el => el.addEventListener('input', updatePreviewAspect));

      function getTargetResolution() {
        if (deviceSelect.value === 'custom') {
          return { 
            w: parseInt(customWidth.value) || 1080, 
            h: parseInt(customHeight.value) || 1920 
          };
        }
        const [w, h] = deviceSelect.value.split('x').map(Number);
        return { w, h };
      }

      function updatePreviewAspect() {
        const res = getTargetResolution();
        const ratio = res.w / res.h;
        aspectHint.textContent = `Target: ${res.w} × ${res.h} (Ratio: ${ratio.toFixed(2)})`;
        
        // Update CSS aspect ratio for preview
        videoPlayer.style.aspectRatio = `${res.w} / ${res.h}`;
      }

      detectBtn.addEventListener('click', () => {
        const w = window.screen.width * window.devicePixelRatio;
        const h = window.screen.height * window.devicePixelRatio;
        // Ensure portrait
        const realW = Math.min(w, h);
        const realH = Math.max(w, h);
        
        customWidth.value = Math.round(realW);
        customHeight.value = Math.round(realH);
        deviceSelect.value = 'custom';
        customResGroup.style.display = 'flex';
        updatePreviewAspect();
        alert(`Detected Screen: ${Math.round(realW)}x${Math.round(realH)}`);
      });

      function resetUI() {
        if (objectURL) URL.revokeObjectURL(objectURL);
        videoPlayer.src = '';
        previewContainer.style.display = 'none';
        currentFile = null;
        convertBtn.disabled = true;
        resetBtn.disabled = true;
        updatePreviewAspect();
      }

      function handleFile(file) {
        if (!file || !file.type.startsWith('video/')) return;
        currentFile = file;
        objectURL = URL.createObjectURL(file);
        videoPlayer.src = objectURL;
        videoPlayer.muted = true;
        previewContainer.style.display = 'flex';
        convertBtn.disabled = false;
        resetBtn.disabled = false;
        fileNameSpan.textContent = file.name;
        statusBadge.textContent = '✅ Ready';
        updatePreviewAspect();
      }

      function downloadPortrait() {
        const res = getTargetResolution();
        const video = videoPlayer;
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const targetAspect = res.w / res.h;

        let cropW, cropH, offX, offY;

        if (vw / vh >= targetAspect) {
          cropH = vh;
          cropW = vh * targetAspect;
          offX = (vw - cropW) / 2;
          offY = 0;
        } else {
          cropW = vw;
          cropH = vw / targetAspect;
          offX = 0;
          offY = (vh - cropH) / 2;
        }

        const canvas = document.createElement('canvas');
        canvas.width = res.w;
        canvas.height = res.h;
        const ctx = canvas.getContext('2d');

        const stream = canvas.captureStream(30);
        
        // Audio
        try {
          const vStream = video.captureStream ? video.captureStream() : video.mozCaptureStream();
          if (vStream.getAudioTracks().length > 0) stream.addTrack(vStream.getAudioTracks()[0]);
        } catch(e) {}

        const recorder = new MediaRecorder(stream, {
          mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm',
          videoBitsPerSecond: 8000000
        });

        let chunks = [];
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `${currentFile.name.split('.')[0]}_${res.w}x${res.h}.webm`;
          a.click();
          convertBtn.disabled = false;
          convertBtn.textContent = '⬇ Download for Phone';
        };

        video.currentTime = 0;
        let active = true;
        function render() {
          if (!active) return;
          ctx.drawImage(video, offX, offY, cropW, cropH, 0, 0, res.w, res.h);
          if (video.ended) {
            active = false;
            recorder.stop();
          } else {
            requestAnimationFrame(render);
          }
        }

        video.play().then(() => {
          recorder.start();
          render();
          convertBtn.disabled = true;
          convertBtn.textContent = '⏳ Encoding...';
        });
      }

      fileInput.addEventListener('change', e => handleFile(e.target.files[0]));
      dropzone.addEventListener('click', () => fileInput.click());
      convertBtn.addEventListener('click', downloadPortrait);
      resetBtn.addEventListener('click', resetUI);
      updatePreviewAspect();
    })();
  </script>
</body>
</html>
